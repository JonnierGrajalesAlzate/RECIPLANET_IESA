<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <script src="https://kit.fontawesome.com/7e5b2d153f.js" crossorigin="anonymous"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/pregunta.css">

  <link rel="shortcut icon" href="./assets/icons8-signo-de-reciclaje-50.png">

  <title>Quiz | Reciplanet 🌱</title>
</head>

<body>

  <!-- NAV -->
  <header class="header">
    <nav class="nav container">
      <h1 class="logo">🌱 Quiz Reciplanet</h1>
      <a href="./index.html" class="btn-back">
        <i class="fas fa-arrow-left"></i> Volver
      </a>
    </nav>
  </header>

  <!-- QUIZ -->
  <section class="quiz container">

    <!-- HEADER QUIZ -->
    <div class="quiz-header">
      <button id="ayuda" class="btn-help">
        <i class="fas fa-circle-question"></i> Ayuda
      </button>

      <h2 id="pregunta">Aquí va la pregunta</h2>

      <img id="imagen" src="./assets/escud.png" alt="Imagen pregunta">
    </div>

    <!-- OPCIONES -->
    <div class="options">
      <button class="option" data-index="0">Opción 1</button>
      <button class="option" data-index="1">Opción 2</button>
      <button class="option" data-index="2">Opción 3</button>
      <button class="option" data-index="3">Opción 4</button>
    </div>

  </section>

  <!-- LIBRERÍAS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JS -->
  <script src="./script/pregunta2.js"></script>
  <script src="./script/preguntas.js"></script>

  <!-- SCRIPT MODERNO -->
  <script>
    const opciones = document.querySelectorAll(".option");

    opciones.forEach(btn => {
      btn.addEventListener("click", () => {
        const index = btn.getAttribute("data-index");
        seleccionarOpción(index);
      });
    });

    document.getElementById("ayuda").addEventListener("click", ayuda);
  </script>

</body>
</html>
