<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Reciplanet</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/usuario.css">
</head>

<body>

  <div class="perfil-container">

    <!-- CARD -->
    <div class="perfil-card">

      <!-- IMAGEN -->
      <div class="perfil-img">
        <img src="./assets/user.png" alt="Usuario">
      </div>

      <!-- INFO -->
      <div class="perfil-info">
        <h2 id="nombre">👤 Nombre: Jonnier</h2>
        <p id="email">📧 Email: ejemplo@gmail.com</p>
        <p id="puntos">🏆 Puntos: 0</p>
      </div>

      <!-- BOTONES -->
      <div class="perfil-botones">
        <a href="./index.html" class="btn volver">⬅ Volver</a>
        <a href="./intro.html" class="btn logout">🚪 Cerrar sesión</a>
      </div>

    </div>

  </div>

</body>
</html>
